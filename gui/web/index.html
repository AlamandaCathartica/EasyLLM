<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("easyllm-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<title>EasyLLM</title>
<style>

  /* =====================================================================
     THEME - Material 3 baseline scheme (seed #6750A4), same tokens as Plane.
     No CDN, no web fonts: this page works with no internet access at all.
     ===================================================================== */
  :root {
    color-scheme: light dark;
    --font: Roboto, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --md-sys-color-primary: #6750A4;
    --md-sys-color-on-primary: #FFFFFF;
    --md-sys-color-primary-container: #EADDFF;
    --md-sys-color-on-primary-container: #21005D;
    --md-sys-color-secondary: #625B71;
    --md-sys-color-on-secondary: #FFFFFF;
    --md-sys-color-secondary-container: #E8DEF8;
    --md-sys-color-on-secondary-container: #1D192B;
    --md-sys-color-tertiary: #7D5260;
    --md-sys-color-on-tertiary: #FFFFFF;
    --md-sys-color-tertiary-container: #FFD8E4;
    --md-sys-color-on-tertiary-container: #31111D;
    --md-sys-color-error: #B3261E;
    --md-sys-color-on-error: #FFFFFF;
    --md-sys-color-error-container: #F9DEDC;
    --md-sys-color-on-error-container: #410E0B;
    --md-sys-color-surface: #FEF7FF;
    --md-sys-color-on-surface: #1D1B20;
    --md-sys-color-surface-variant: #E7E0EC;
    --md-sys-color-on-surface-variant: #49454F;
    --md-sys-color-surface-container-lowest: #FFFFFF;
    --md-sys-color-surface-container-low: #F7F2FA;
    --md-sys-color-surface-container: #F3EDF7;
    --md-sys-color-surface-container-high: #ECE6F0;
    --md-sys-color-surface-container-highest: #E6E0E9;
    --md-sys-color-outline: #79747E;
    --md-sys-color-outline-variant: #CAC4D0;
    --md-sys-color-inverse-surface: #322F35;
    --md-sys-color-inverse-on-surface: #F5EFF7;

    /* app-level (not in the M3 spec): success / warning */
    --ok: #1B6B3A;          --ok-container: #C7F0D2;     --on-ok-container: #00210E;
    --warn: #8A5100;        --warn-container: #FFDDB8;   --on-warn-container: #2C1600;
    --issue-container: #FFE29A; --on-issue-container: #2E2200; --issue-panel: #2E2200; --issue-btn: #6F5200; --on-issue-btn: #FFFFFF;
    --log-bg: #FFFFFF;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --md-sys-color-primary: #D0BCFF;
    --md-sys-color-on-primary: #381E72;
    --md-sys-color-primary-container: #4F378B;
    --md-sys-color-on-primary-container: #EADDFF;
    --md-sys-color-secondary: #CCC2DC;
    --md-sys-color-on-secondary: #332D41;
    --md-sys-color-secondary-container: #4A4458;
    --md-sys-color-on-secondary-container: #E8DEF8;
    --md-sys-color-tertiary: #EFB8C8;
    --md-sys-color-on-tertiary: #492532;
    --md-sys-color-tertiary-container: #633B48;
    --md-sys-color-on-tertiary-container: #FFD8E4;
    --md-sys-color-error: #F2B8B5;
    --md-sys-color-on-error: #601410;
    --md-sys-color-error-container: #8C1D18;
    --md-sys-color-on-error-container: #F9DEDC;
    --md-sys-color-surface: #141218;
    --md-sys-color-on-surface: #E6E0E9;
    --md-sys-color-surface-variant: #49454F;
    --md-sys-color-on-surface-variant: #CAC4D0;
    --md-sys-color-surface-container-lowest: #0F0D13;
    --md-sys-color-surface-container-low: #1D1B20;
    --md-sys-color-surface-container: #211F26;
    --md-sys-color-surface-container-high: #2B2930;
    --md-sys-color-surface-container-highest: #36343B;
    --md-sys-color-outline: #938F99;
    --md-sys-color-outline-variant: #49454F;
    --md-sys-color-inverse-surface: #E6E0E9;
    --md-sys-color-inverse-on-surface: #322F35;
    --ok: #8BD6A0;         --ok-container: #0B3A1E;     --on-ok-container: #C7F0D2;
    --warn: #FFB963;       --warn-container: #4A2B00;   --on-warn-container: #FFDDB8;
    --issue-container: #574100; --on-issue-container: #FFE9B3; --issue-panel: #FFE9B3; --issue-btn: #F6C94A; --on-issue-btn: #2E2200;
    --log-bg: #0F0D13;
  }

  /* type scale */
  .t-headline { font: 400 28px/36px var(--font); }
  .t-title    { font: 500 16px/24px var(--font); letter-spacing: .15px; }
  .t-body-l   { font: 400 16px/24px var(--font); letter-spacing: .5px; }
  .t-body     { font: 400 14px/20px var(--font); letter-spacing: .25px; }
  .t-small    { font: 400 12px/16px var(--font); letter-spacing: .4px; }
  .t-label    { font: 500 12px/16px var(--font); letter-spacing: .5px; }

  /* =====================================================================
     LAYOUT
     ===================================================================== */
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family: var(--font);
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    -webkit-font-smoothing: antialiased;
  }
  [hidden]{display:none !important;}

  .app{max-width:560px;margin:0 auto;padding-bottom:48px;}
  .theme-toggle{
    position:fixed;top:12px;right:12px;z-index:20;
    background:var(--md-sys-color-surface-container-high);
  }
  .topbar{padding:28px 64px 12px 20px;}
  .topbar h1{margin:0;color:var(--md-sys-color-primary);}
  .topbar p{margin:4px 0 12px;color:var(--md-sys-color-on-surface-variant);}
  .tags{display:flex;gap:8px;flex-wrap:wrap;}
  .tag{
    display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:8px;
    background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container);
  }
  .tag.demo{background:var(--warn-container);color:var(--on-warn-container);}
  .tag.plain{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);}

  .section{padding:0 16px;margin-bottom:12px;}
  .panel{
    --card-bg: var(--md-sys-color-surface-container-low);
    background:var(--card-bg);border-radius:28px;padding:20px 16px;
    display:flex;flex-direction:column;gap:16px;
  }
  .panel.tight{padding:16px;border-radius:20px;gap:12px;}
  .panel-title{margin:0;color:var(--md-sys-color-on-surface);}
  .hint{margin:0;color:var(--md-sys-color-on-surface-variant);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row{display:flex;align-items:center;gap:12px;}
  .row.between{justify-content:space-between;}
  .grow{flex:1;min-width:0;}
  .subhead{margin:0;color:var(--md-sys-color-on-surface-variant);}
  .mono{font-family:var(--font-mono);}

  /* mobile pane switch */
  .pane-switch{position:sticky;top:0;z-index:15;padding:8px 64px 8px 16px;background:var(--md-sys-color-surface);}
  body[data-pane="setup"]   .monitor-wrap{display:none;}
  body[data-pane="monitor"] .controls{display:none;}

  @media (min-width: 960px){
    .pane-switch{display:none;}
    body[data-pane] .monitor-wrap, body[data-pane] .controls{display:block !important;}
    .app{
      max-width:1870px;display:grid;grid-template-columns:520px 1fr;align-items:start;gap:32px;padding:24px 32px;
    }
    .topbar{padding:4px 4px 16px;}
    .section{padding:0;}
    .monitor-wrap{position:sticky;top:24px;height:calc(100vh - 48px);}
    .monitor{height:100%;display:flex;flex-direction:column;gap:12px;}
    .tabpanes{flex:1;min-height:0;overflow:auto;padding-right:4px;}
  }
  @media (max-width: 959px){ .app{padding-bottom:96px;} }

  /* =====================================================================
     COMPONENTS
     ===================================================================== */
  /* buttons */
  .btn{
    height:40px;padding:0 24px;border:0;border-radius:20px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font:500 14px/20px var(--font);letter-spacing:.1px;
    transition:filter .15s, box-shadow .15s, background .15s;
  }
  .btn svg{width:18px;height:18px;flex:none;}
  .btn:disabled{opacity:.38;cursor:not-allowed;}
  .btn:hover:not(:disabled){filter:brightness(1.07);box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .btn:focus-visible,.iconbtn:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:2px;}
  .btn.filled{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);}
  .btn.tonal{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);}
  .btn.danger{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);}
  .btn.outlined{background:transparent;color:var(--md-sys-color-primary);box-shadow:inset 0 0 0 1px var(--md-sys-color-outline);}
  .btn.outlined:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--md-sys-color-outline);background:color-mix(in srgb,var(--md-sys-color-primary) 8%,transparent);filter:none;}
  .btn.text{background:transparent;color:var(--md-sys-color-primary);padding:0 12px;}
  .btn.text:hover:not(:disabled){background:color-mix(in srgb,var(--md-sys-color-primary) 8%,transparent);filter:none;box-shadow:none;}
  .btn.big{height:48px;width:100%;}
  .btn.small{height:32px;padding:0 16px;border-radius:16px;}
  .iconbtn{
    width:40px;height:40px;border:0;border-radius:50%;cursor:pointer;flex:none;
    display:inline-flex;align-items:center;justify-content:center;
    background:transparent;color:var(--md-sys-color-on-surface-variant);
  }
  .iconbtn:hover{background:color-mix(in srgb,var(--md-sys-color-on-surface) 8%,transparent);}
  .iconbtn svg{width:22px;height:22px;}
  .theme-toggle{border-radius:50%;}
  .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ic.fill{fill:currentColor;stroke:none;}

  /* outlined fields */
  .field{position:relative;display:block;min-width:0;}
  .field input,.field select,.field textarea{
    width:100%;height:56px;padding:0 16px;border:1px solid var(--md-sys-color-outline);border-radius:4px;
    background:transparent;color:var(--md-sys-color-on-surface);font:400 16px/24px var(--font);letter-spacing:.5px;
    outline:none;appearance:none;-webkit-appearance:none;transition:border-color .12s, box-shadow .12s;
  }
  .field.mono input,.field.mono textarea{font-family:var(--font-mono);font-size:14px;}
  .field textarea{height:auto;min-height:150px;padding:16px;resize:vertical;line-height:20px;}
  .field input:hover,.field select:hover,.field textarea:hover{border-color:var(--md-sys-color-on-surface);}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--md-sys-color-primary);box-shadow:inset 0 0 0 1px var(--md-sys-color-primary);}
  .field>span{
    position:absolute;left:12px;top:16px;padding:0 4px;background:var(--card-bg, var(--md-sys-color-surface-container-low));
    color:var(--md-sys-color-on-surface-variant);font:400 16px/24px var(--font);pointer-events:none;
    transition:top .12s, font-size .12s, line-height .12s, color .12s;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .field input:focus + span,.field input:not(:placeholder-shown) + span,
  .field textarea:focus + span,.field textarea:not(:placeholder-shown) + span,
  .field select + span{top:-9px;font-size:12px;line-height:16px;}
  .field input:focus + span,.field select:focus + span,.field textarea:focus + span{color:var(--md-sys-color-primary);}
  .field.invalid input,.field.invalid select{border-color:var(--md-sys-color-error);box-shadow:inset 0 0 0 1px var(--md-sys-color-error);}
  .field.invalid > span{color:var(--md-sys-color-error);}
  .field.select::after{
    content:"";position:absolute;right:18px;top:26px;border:5px solid transparent;border-top-color:var(--md-sys-color-on-surface-variant);pointer-events:none;
  }
  .field.select select{padding-right:40px;cursor:pointer;}
  .field option{background:var(--md-sys-color-surface-container);color:var(--md-sys-color-on-surface);}
  .field input:disabled,.field select:disabled{opacity:.5;cursor:not-allowed;}
  .field input[type=number]{-moz-appearance:textfield;}
  .field input[type=number]::-webkit-outer-spin-button,.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .sm-field input{height:48px;}
  .sm-field > span{top:12px;}

  /* switch */
  .sw-row{display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;}
  .sw-text{display:flex;flex-direction:column;gap:2px;}
  .sw-text small{color:var(--md-sys-color-on-surface-variant);font:400 12px/16px var(--font);letter-spacing:.4px;}
  .switch{position:relative;width:52px;height:32px;flex:none;}
  .switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1;}
  .switch i{
    position:absolute;inset:0;border-radius:16px;border:2px solid var(--md-sys-color-outline);
    background:var(--md-sys-color-surface-container-highest);transition:background .15s,border-color .15s;
  }
  .switch i::before{
    content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;margin-top:-8px;border-radius:50%;
    background:var(--md-sys-color-outline);transition:all .15s;
  }
  .switch input:checked + i{background:var(--md-sys-color-primary);border-color:var(--md-sys-color-primary);}
  .switch input:checked + i::before{left:24px;width:24px;height:24px;margin-top:-12px;background:var(--md-sys-color-on-primary);transform:translateX(-4px);}
  .switch input:focus-visible + i{outline:2px solid var(--md-sys-color-primary);outline-offset:2px;}
  .switch input:disabled + i{opacity:.4;}

  /* segmented */
  .seg{display:flex;height:40px;border:1px solid var(--md-sys-color-outline);border-radius:20px;overflow:hidden;}
  .seg button{
    flex:1;border:0;border-left:1px solid var(--md-sys-color-outline);background:transparent;cursor:pointer;
    color:var(--md-sys-color-on-surface);font:500 14px/20px var(--font);padding:0 8px;
  }
  .seg button:first-child{border-left:0;}
  .seg button[aria-pressed="true"]{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);}
  .seg button:hover:not([aria-pressed="true"]){background:color-mix(in srgb,var(--md-sys-color-on-surface) 8%,transparent);}

  /* slider */
  .slider-row{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:16px;row-gap:6px;}
  .slider-row .row-label{color:var(--md-sys-color-on-surface);}
  .slider-row .row-value{color:var(--md-sys-color-on-surface-variant);font-family:var(--font-mono);}
  .slider-row input[type=range]{grid-column:1 / -1;}
  .slider-row.with-field{grid-template-columns:1fr 104px;}
  .slider-row.with-field .row-label{grid-column:1 / -1;}
  .slider-row.with-field input[type=range]{grid-column:1;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:transparent;cursor:pointer;
    --f:0.5;
  }
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--md-sys-color-primary) calc(10px + (100% - 20px) * var(--f)),var(--md-sys-color-surface-container-highest) calc(10px + (100% - 20px) * var(--f)));}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--md-sys-color-surface-container-highest);}
  input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--md-sys-color-primary);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--md-sys-color-primary);border:0;box-shadow:0 1px 3px rgba(0,0,0,.35);}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--md-sys-color-primary);border:0;}
  input[type=range]:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:2px;border-radius:8px;}

  /* banners, chips */
  .banner{border-radius:12px;padding:12px 16px;}
  .banner.error{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);}
  .banner.warn{background:var(--warn-container);color:var(--on-warn-container);}
  .banner.info{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);}
  .banner:empty{display:none;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;
    border:1px solid var(--md-sys-color-outline);background:transparent;color:var(--md-sys-color-on-surface-variant);
    font:500 13px/16px var(--font);cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);border-color:transparent;}
  .status{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:14px;font:500 13px/16px var(--font);
    background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface-variant);}
  .status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;}
  .status.busy::before{animation:pulse 1.2s ease-in-out infinite;}
  .status.train{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);}
  .status.train::before{animation:pulse 1.2s ease-in-out infinite;}
  .status.ok{background:var(--ok-container);color:var(--on-ok-container);}
  .status.bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);}
  .status.warn{background:var(--warn-container);color:var(--on-warn-container);}
  @keyframes pulse{50%{opacity:.25;}}

  details.fold{padding:0;}
  details.fold > summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:20px 16px;
    font:500 16px/24px var(--font);letter-spacing:.15px;
  }
  details.fold > summary::-webkit-details-marker{display:none;}
  details.fold > summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--md-sys-color-on-surface-variant);border-bottom:2px solid var(--md-sys-color-on-surface-variant);transform:rotate(45deg);transition:transform .15s;margin-right:4px;}
  details.fold[open] > summary::after{transform:rotate(225deg);}
  details.fold > .fold-body{padding:0 16px 20px;display:flex;flex-direction:column;gap:16px;}

  /* dataset summary */
  .stat{background:var(--md-sys-color-surface-container-highest);border-radius:12px;padding:10px 12px;min-width:0;}
  .stat .k{color:var(--md-sys-color-on-surface-variant);}
  .stat .v{font:500 17px/24px var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat .s{color:var(--md-sys-color-on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* =====================================================================
     MONITOR
     ===================================================================== */
  .monitor{display:flex;flex-direction:column;gap:12px;}
  .run-card{gap:14px;}
  .progress{height:8px;border-radius:4px;background:var(--md-sys-color-surface-container-highest);overflow:hidden;}
  .progress > div{height:100%;width:0;border-radius:4px;background:var(--md-sys-color-primary);transition:width .5s ease;}
  .progress.indeterminate > div{width:30%;animation:slide 1.3s ease-in-out infinite;}
  @keyframes slide{0%{margin-left:-30%;}100%{margin-left:100%;}}
  .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  @media (max-width:760px){.tiles{grid-template-columns:repeat(3,1fr);}}
  .tabs{display:flex;border-bottom:1px solid var(--md-sys-color-outline-variant);}
  .tab{
    flex:1;height:48px;border:0;background:transparent;cursor:pointer;position:relative;
    color:var(--md-sys-color-on-surface-variant);font:500 14px/20px var(--font);letter-spacing:.1px;
  }
  .tab:hover{background:color-mix(in srgb,var(--md-sys-color-on-surface) 6%,transparent);}
  .tab[aria-selected="true"]{color:var(--md-sys-color-primary);}
  .tab[aria-selected="true"]::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--md-sys-color-primary);}
  .tabpanes > section{display:none;flex-direction:column;gap:12px;padding-top:12px;}
  .tabpanes > section.active{display:flex;}
  #pane-log.active{height:100%;}


  .bar{height:8px;border-radius:4px;background:var(--md-sys-color-surface-container-highest);overflow:hidden;}
  .bar > div{height:100%;border-radius:4px;background:var(--md-sys-color-primary);transition:width .4s ease;}
  .bar.hot > div{background:var(--md-sys-color-error);}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;}
  .kv dt{color:var(--md-sys-color-on-surface-variant);}

  pre.code{
    margin:0;padding:12px;border-radius:12px;background:var(--log-bg);border:1px solid var(--md-sys-color-outline-variant);

  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px 16px;text-align:center;color:var(--md-sys-color-on-surface-variant);border:1px dashed var(--md-sys-color-outline);border-radius:20px;}

  .snackbar{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);z-index:50;max-width:min(560px,92vw);

  /* ---- mode switch + dataset maker ---- */
  .tagbar{display:grid;grid-template-columns:minmax(90px,190px) 1fr 84px;align-items:center;gap:12px;min-height:30px;

  .dialog .d-icon{width:96px;height:96px;margin-bottom:8px;fill:currentColor;}

  .dialog .d-sub{margin:0;font-size:16px;line-height:24px;font-weight:400;font-family:inherit;opacity:.85;}
  .dialog .d-info{

  .dialog .d-btn.tonal:hover{background:color-mix(in srgb,var(--md-sys-color-on-error-container) 10%,transparent);box-shadow:inset 0 0 0 1px var(--md-sys-color-on-error-container);filter:none;}

  }
  .scrim{overscroll-behavior:contain;touch-action:none;}
  .dialog .d-btn{
    border:0;cursor:pointer;height:40px;padding:0 24px;border-radius:20px;font-size:14px;line-height:20px;font-weight:500;font-family:inherit;

  @keyframes dspin{to{transform:rotate(360deg);}}

  /* =====================================================================
     EASYLLM layout: wide chat + floating settings window

  @keyframes slide{0%{margin-left:-30%;}100%{margin-left:100%;}}

  .msgs{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;}

  .msg{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .msg.user{align-self:flex-end;align-items:flex-end;max-width:80%;}

  .bubble{font:400 16px/25px var(--font);letter-spacing:.15px;overflow-wrap:anywhere;min-width:0;max-width:100%;}
  .msg.user .bubble{padding:12px 18px;border-radius:22px 22px 6px 22px;background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);white-space:pre-wrap;}
  .msg.assistant .bubble{padding:0 4px;}
  .bubble p{margin:0 0 12px;} .bubble p:last-child{margin-bottom:0;}
  .bubble ul,.bubble ol{margin:0 0 12px;padding-left:24px;} .bubble li{margin:3px 0;}

  .bubble .cursor::after{content:"";display:inline-block;width:8px;height:17px;margin-left:2px;vertical-align:-3px;border-radius:2px;background:var(--md-sys-color-primary);animation:pulse 1s ease-in-out infinite;}
  .msg .meta{display:flex;align-items:center;gap:2px;color:var(--md-sys-color-on-surface-variant);padding:0 2px;min-height:30px;}
  .msg .meta .mono{font-size:12px;margin-right:8px;}
  .msg .meta .iconbtn{width:30px;height:30px;} .msg .meta .iconbtn svg{width:17px;height:17px;}
  .msg .banner{margin-top:6px;}
  .welcome{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--md-sys-color-on-surface-variant);padding:48px 16px;}
  .welcome h2{margin:0;color:var(--md-sys-color-on-surface);font:400 28px/36px var(--font);}
  .welcome p{margin:0;max-width:420px;}

  .dock{width:100%;max-width:1000px;margin:0 auto;padding:8px 24px 20px;}
  @media (max-width:699px){.col{padding:12px 14px 8px;}.dock{padding:6px 12px 12px;}.msg.user{max-width:90%;}}
  .composer{display:flex;align-items:flex-end;gap:8px;background:var(--md-sys-color-surface-container-high);border-radius:28px;padding:6px 6px 6px 22px;}
  .composer:focus-within{box-shadow:inset 0 0 0 2px var(--md-sys-color-primary);}
  .composer textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--md-sys-color-on-surface);
    font:400 16px/24px var(--font);letter-spacing:.3px;padding:12px 0;max-height:200px;min-height:48px;}
  .composer textarea::placeholder{color:var(--md-sys-color-on-surface-variant);}
  .composer textarea:disabled{opacity:.6;}
  .sendbtn{width:48px;height:48px;border:0;border-radius:50%;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;
    background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);}
  .sendbtn:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .sendbtn:disabled{opacity:.38;cursor:not-allowed;}
  .sendbtn.stop{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);}
  .sendbtn svg{width:22px;height:22px;}

  /* settings dialog: centered modal on the shared blurred scrim */
  .sheet{--card-bg:var(--md-sys-color-surface-container-high);box-sizing:border-box;width:min(960px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);
    display:flex;flex-direction:column;background:var(--card-bg);color:var(--md-sys-color-on-surface);border-radius:28px;touch-action:auto;
    box-shadow:0 8px 12px 6px rgba(0,0,0,.15),0 4px 4px rgba(0,0,0,.3);
    transform:scale(.92) translateY(12px);opacity:0;transition:transform .3s cubic-bezier(.2,0,0,1.2),opacity .2s ease;}
  .scrim.show .sheet{transform:none;opacity:1;}
  .sheet-head{display:flex;align-items:center;gap:12px;padding:24px 32px 8px;}
  .sheet-head h2{margin:0;flex:1;font:400 28px/36px var(--font);}
  .sheet-body{overflow:auto;padding:12px 32px 20px;display:grid;grid-template-columns:1fr 1fr;gap:36px;overscroll-behavior:contain;}
  .sheet-col{display:flex;flex-direction:column;gap:20px;min-width:0;}
  .sheet-col h3{margin:0;font:500 14px/20px var(--font);letter-spacing:.1px;color:var(--md-sys-color-primary);text-transform:uppercase;}
  .sheet-wide{grid-column:1 / -1;}
  .sheet details > summary{cursor:pointer;color:var(--md-sys-color-on-surface-variant);padding:4px 0;}
  .sheet-foot{display:flex;justify-content:flex-end;padding:4px 32px 24px;}
  .sheet .d-btn{border:0;cursor:pointer;height:40px;padding:0 24px;border-radius:20px;font-size:14px;line-height:20px;font-weight:500;font-family:inherit;
    background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);}
  .sheet .d-btn:hover{box-shadow:0 1px 3px rgba(0,0,0,.35);filter:brightness(1.08);}
  .sheet .d-btn:focus-visible{outline:2px solid var(--md-sys-color-on-surface);outline-offset:2px;}
  .logsheet{width:min(820px,100%);}
  .sheet-body.one{display:block;padding-top:8px;}
  .sheet .logsheet .logbox,.logsheet .logbox{height:min(56vh,540px);min-height:0;margin-top:0;}
  .logbox:empty::before{content:"No log lines yet";color:var(--md-sys-color-on-surface-variant);font:400 13px/20px var(--font);}
  .btnrow{display:flex;gap:12px;margin-top:4px;} .btnrow .btn{flex:1;}
  @media (max-width:759px){
    .sheet-head{padding:18px 20px 4px;} .sheet-foot{padding:4px 20px 18px;} .sheet-head h2{font-size:24px;}
    .sheet-body{grid-template-columns:1fr;padding:8px 20px 24px;gap:28px;}
  }
  @media (prefers-reduced-motion:reduce){.sheet{transition:none;}}
  .btn{white-space:nowrap;}
  .appbar .status{flex:none;}
  @media (max-width:699px){
    .appbar{gap:2px;padding:8px 4px 8px 16px;}

    .appbar .grow{overflow:hidden;}
    #btnExport{display:none;}
  }
</style>

<body>
<div class="shell">
  <header class="appbar">
    <h1>EasyLLM</h1>
    <div class="grow">
      <span class="status" id="statusChip">Idle</span>
      <span class="t-body model" id="phaseText"></span>
      <span class="t-small vram" id="vramText"></span>
    </div>
    <button class="iconbtn" id="btnExport" title="Export chat" aria-label="Export chat"></button>
    <button class="iconbtn" id="btnClear" title="Clear chat" aria-label="Clear chat"></button>
    <button class="iconbtn" id="btnLog" title="Server log" aria-label="Server log"></button>
    <button class="iconbtn" id="btnSettings" title="Settings" aria-label="Settings"></button>
    <button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme"></button>
  </header>
  <div class="loadbar" id="loadbar"><div></div></div>

  <main class="msgs" id="msgs"><div class="col" id="col"></div></main>

  <div class="dock">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Load a model to start chatting" disabled></textarea>
      <button class="sendbtn" id="sendBtn" type="button" aria-label="Send" disabled></button>
    </div>
  </div>
</div>

<!-- ====================== SETTINGS DIALOG (centered modal) ====================== -->
<div class="scrim" id="settingsScrim" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <section class="sheet" id="sheet">
    <div class="sheet-head">
      <h2 id="setTitle">Settings</h2>
    </div>
    <div class="sheet-body">
      <div class="sheet-col">
        <h3>Model</h3>
        <label class="field select"><select id="preset"></select><span>Preset</span></label>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label class="field mono"><input id="custom" placeholder=" " spellcheck="false" autocomplete="off" /><span>Or paste a Hugging Face link</span></label>
          <p class="hint t-small" id="resolved"></p>
        </div>
        <div>
          <div class="t-label subhead" style="margin-bottom:8px">Precision</div>
          <div class="seg" id="quantSeg" role="group" aria-label="Precision">
            <button type="button" data-val="fp16" aria-pressed="false">fp16</button>
            <button type="button" data-val="8bit" aria-pressed="false">8-bit</button>
            <button type="button" data-val="4bit" aria-pressed="true">4-bit</button>
          </div>
        </div>
        <div id="fit" class="banner info t-body"></div>
        <label class="field mono"><input id="token" type="password" placeholder=" " autocomplete="off" spellcheck="false" /><span>HF token (optional, gated models)</span></label>
        <div id="runError" class="banner error t-body" role="alert"></div>
        <div class="btnrow">
          <button class="btn filled big" data-act="load" type="button"></button>
          <button class="btn danger big" data-act="unload" type="button"></button>
        </div>
      </div>

      <div class="sheet-col">
        <h3>Generation</h3>
        <label class="field"><textarea id="system" rows="4" placeholder=" " style="min-height:120px"></textarea><span>System prompt</span></label>
        <div class="slider-row"><span class="row-label t-body">Max new tokens</span><span class="row-value t-body" id="v_max"></span>
          <input type="range" id="r_max" min="64" max="2048" step="32" /></div>
        <div class="slider-row"><span class="row-label t-body">Temperature <span class="t-small" style="color:var(--md-sys-color-on-surface-variant)">(0 = greedy)</span></span><span class="row-value t-body" id="v_temp"></span>
          <input type="range" id="r_temp" min="0" max="1.5" step="0.05" /></div>
        <div class="slider-row"><span class="row-label t-body">Top-p</span><span class="row-value t-body" id="v_top_p"></span>
          <input type="range" id="r_top_p" min="0.1" max="1" step="0.05" /></div>
        <div class="slider-row"><span class="row-label t-body">Repetition penalty</span><span class="row-value t-body" id="v_rep"></span>
          <input type="range" id="r_rep" min="1" max="1.3" step="0.01" /></div>
        <button class="btn text small" id="resetGen" type="button" style="align-self:flex-start">Reset to defaults</button>
      </div>

    </div>
    <div class="sheet-foot"><button class="d-btn" id="winClose" type="button" title="Close (Esc)">Close</button></div>
  </section>
</div>

<!-- ====================== LOG DIALOG ====================== -->
<div class="scrim" id="logScrim" role="dialog" aria-modal="true" aria-labelledby="logTitle">
  <section class="sheet logsheet">
    <div class="sheet-head">
      <h2 id="logTitle">Server log</h2>

    </div>
    <div class="sheet-body one">
      <div class="logbox" id="logbox"></div>
    </div>
    <div class="sheet-foot"><button class="d-btn" id="logClose" type="button" title="Close (Esc)">Close</button></div>
  </section>
</div>

<div class="snackbar t-body" id="snack" role="status" aria-live="polite"></div>

<div class="scrim" id="connScrim" role="alertdialog" aria-modal="true" aria-labelledby="connTitle">
  <div class="dialog">
    <svg class="d-icon" viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4c-1.48 0-2.85.43-4.01 1.17l1.46 1.46a5.5 5.5 0 0 1 8.41 3.9v.5h1.5a3 3 0 0 1 1.31 5.69l1.45 1.45A4.98 4.98 0 0 0 19.35 10.04zM3 5.27l2.75 2.74A7.49 7.49 0 0 0 5 9.5C2.24 9.8 0 12.1 0 15c0 3.31 2.69 6 6 6h11.73l2 2L21 21.73 4.27 4 3 5.27zM6 19c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95c.1-.19.2-.37.32-.55L17.73 19H6z"/></svg>

    <div class="d-actions"><button class="d-btn" id="connRetry" type="button" style="margin-left:auto">Retry now</button></div>
  </div>
</div>

  play: '<svg class="ic fill" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  eject: '<svg class="ic fill" viewBox="0 0 24 24"><path d="M5 17h14v2H5zM12 5l7 9H5z"/></svg>',
  download: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>',
  close: '<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  term: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M12 15h5"/></svg>',
  tune: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
  minus: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  expand: '<svg class="ic" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></svg>',
  chat: '<svg class="ic" style="width:44px;height:44px;opacity:.7" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>',
};

/* ---------------------------------------------------------------- presets */
const PRESETS = [
  ["Up to 3B  (fits in fp16)", [
    ["Qwen/Qwen2.5-3B-Instruct", "Qwen2.5 3B Instruct", 3.1],
    ["meta-llama/Llama-3.2-3B-Instruct", "Llama 3.2 3B Instruct (gated)", 3.2]]],
  ["7B to 9B  (use 4-bit or 8-bit)", [
    ["Qwen/Qwen2.5-7B-Instruct", "Qwen2.5 7B Instruct", 7.6],
    ["mistralai/Mistral-7B-Instruct-v0.3", "Mistral 7B Instruct v0.3", 7.2],
    ["meta-llama/Llama-3.1-8B-Instruct", "Llama 3.1 8B Instruct (gated)", 8.0]]],
  ["12B to 13B  (4-bit only)", [
    ["mistralai/Mistral-Nemo-Instruct-2407", "Mistral Nemo 12B Instruct", 12.2],
    ["NousResearch/Llama-2-13b-chat-hf", "Llama 2 13B Chat", 13.0]]],
];
const FLAT = PRESETS.flatMap((g) => g[1]);
const BPP = { fp16: 2.0, "8bit": 1.1, "4bit": 0.62 };   // approx. bytes per parameter incl. quant overhead
const GIB = 1024 ** 3;

/* ---------------------------------------------------------------- settings */
const DEF = { preset: "Qwen/Qwen2.5-7B-Instruct", custom: "", quant: "4bit", system: "You are a helpful assistant.",
              max: 512, temp: 0.7, top_p: 0.9, rep: 1.05 };
const GEN_KEYS = ["system", "max", "temp", "top_p", "rep"];
let cfg = { ...DEF };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("easyllm-cfg") || "{}")); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem("easyllm-cfg", JSON.stringify(cfg)); } catch (e) {} };

let ST = { status: "idle", gpu: { total: 0, used: 0, name: "" }, gen: {}, system: {} };
let chat = [];
try { chat = JSON.parse(localStorage.getItem("easyllm-chat") || "[]"); } catch (e) { chat = []; }
let busy = false, fails = 0, logSeq = 0;
const saveChat = () => { try { localStorage.setItem("easyllm-chat", JSON.stringify(chat.slice(-60))); } catch (e) {} };

/* ---------------------------------------------------------------- helpers */
function toast(msg, ms = 4000) {
  const s = $("#snack"); s.textContent = msg; s.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => s.classList.remove("show"), ms);
}
const fmtT = (s) => { s = Math.max(0, Math.round(s)); return s >= 60 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`; };
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

/* tiny, safe markdown: code fences, inline code, bold/italic, lists, headings */
function md(src) {
  return src.split("```").map((part, i) => {
    if (i % 2) {
      const nl = part.indexOf("\n");
      const code = nl >= 0 ? part.slice(nl + 1) : "";
      return `<pre class="code"><code>${esc(code.replace(/\n$/, ""))}</code></pre>`;
    }
    const inline = (t) => esc(t).replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
    return part.split(/\n{2,}/).map((blk) => {
      blk = blk.replace(/^\n+|\n+$/g, ""); if (!blk) return "";
      const lines = blk.split("\n");
      if (lines.every((l) => /^\s*[-*]\s+/.test(l))) return "<ul>" + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*]\s+/, ""))}</li>`).join("") + "</ul>";
      if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l))) return "<ol>" + lines.map((l) => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ""))}</li>`).join("") + "</ol>";
      if (/^#{1,4}\s/.test(blk)) return `<h4>${inline(blk.replace(/^#{1,4}\s+/, ""))}</h4>`;
      return `<p>${lines.map(inline).join("<br>")}</p>`;
    }).join("");
  }).join("");
}

/* ---------------------------------------------------------------- theme */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("#themeToggle").innerHTML = t === "dark" ? IC.sun : IC.moon;
  try { localStorage.setItem("easyllm-theme", t); } catch (e) {}
}
applyTheme(document.documentElement.getAttribute("data-theme"));
$("#themeToggle").onclick = () => applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
$("#btnLog").innerHTML = IC.term; $("#btnExport").innerHTML = IC.download; $("#btnClear").innerHTML = IC.trash; $("#btnSettings").innerHTML = IC.tune;

/* ---------------------------------------------------------------- dialogs (settings + log) */
const scrim = $("#settingsScrim"), logScrim = $("#logScrim");
let isOpen = false, logOpen = false;
function setOpen(o) {
  isOpen = o; if (o) setLogOpen(false);
  scrim.classList.toggle("show", o);
  $("#btnSettings").setAttribute("aria-pressed", String(o));
  if (o) fit();
}
function setLogOpen(o) {
  logOpen = o; if (o) setOpen(false);
  logScrim.classList.toggle("show", o);
  $("#btnLog").setAttribute("aria-pressed", String(o));
  if (o) requestAnimationFrame(() => { const b = $("#logbox"); b.scrollTop = b.scrollHeight; });
}
$("#winClose").onclick = () => setOpen(false);
$("#logClose").onclick = () => setLogOpen(false);
$("#btnSettings").onclick = () => setOpen(!isOpen);
$("#btnLog").onclick = () => setLogOpen(!logOpen);
[[scrim, setOpen], [logScrim, setLogOpen]].forEach(([el, fn]) => el.addEventListener("pointerdown", (e) => { if (e.target === el) fn(false); }));
addEventListener("keydown", (e) => { if (e.key === "Escape") { if (isOpen) setOpen(false); if (logOpen) setLogOpen(false); } });

/* ---------------------------------------------------------------- form */
const sel = $("#preset");
sel.innerHTML = PRESETS.map(([g, items]) => `<optgroup label="${g}">${items.map(([id, n]) => `<option value="${id}">${n}</option>`).join("")}</optgroup>`).join("");
if (![...sel.options].some((o) => o.value === cfg.preset)) cfg.preset = DEF.preset;
sel.value = cfg.preset;
$("#custom").value = cfg.custom;
$("#system").value = cfg.system;
const SL = [["max", (v) => String(Math.round(v))], ["temp", (v) => (+v).toFixed(2)], ["top_p", (v) => (+v).toFixed(2)], ["rep", (v) => (+v).toFixed(2)]];
const paintSliders = () => SL.forEach(([k, f]) => {
  const r = $("#r_" + k); r.value = cfg[k];
  $("#v_" + k).textContent = f(r.value); r.style.setProperty("--f", (r.value - r.min) / (r.max - r.min));
});
SL.forEach(([k]) => { $("#r_" + k).oninput = (e) => { cfg[k] = +e.target.value; paintSliders(); saveCfg(); }; });
paintSliders();
$("#resetGen").onclick = () => { GEN_KEYS.forEach((k) => cfg[k] = DEF[k]); $("#system").value = cfg.system; paintSliders(); saveCfg(); };
const paintQuant = () => $$("#quantSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.val === cfg.quant)));
$$("#quantSeg button").forEach((b) => b.onclick = () => { cfg.quant = b.dataset.val; paintQuant(); saveCfg(); fit(); });
sel.onchange = () => { cfg.preset = sel.value; saveCfg(); fit(); };
$("#custom").oninput = (e) => { cfg.custom = e.target.value; saveCfg(); fit(); };
$("#system").oninput = (e) => { cfg.system = e.target.value; saveCfg(); };
paintQuant();

/* accepts https://huggingface.co/org/name (any sub-path, query or #anchor), hf.co links, or a bare org/name */
function parseRepo(s) {
  s = (s || "").trim().replace(/[?#].*$/, "").replace(/^(https?:\/\/)?(www\.)?(huggingface\.co|hf\.co)\//i, "");
  if (/^https?:\/\//i.test(s)) return "";            // some other website
  const p = s.split("/").filter(Boolean);
  if (p[0] === "models") p.shift();
  if (p.length < 2 || p[0].includes(".")) return "";   // not org/name (HF user names have no dots)
  return p.slice(0, 2).join("/");
}
const modelId = () => parseRepo(cfg.custom) || cfg.preset;
function params() {
  const custom = parseRepo(cfg.custom);
  if (!custom) { const f = FLAT.find((x) => x[0] === cfg.preset); return f ? f[2] : 0; }
  const m = /(?:^|[^a-zA-Z0-9.])(\d+(?:\.\d+)?)\s*[bB](?![a-zA-Z])/.exec(custom.split("/")[1]);
  return m ? +m[1] : 0;
}
function fit() {
  const rp = parseRepo(cfg.custom);
  $("#resolved").textContent = cfg.custom.trim() ? (rp ? `Will load ${rp}` : "Not a valid link. Expected huggingface.co/org/model") : "";
  $("#resolved").style.color = cfg.custom.trim() && !rp ? "var(--md-sys-color-error)" : "";
  const el = $("#fit"), p = params(), tot = ST.gpu.total || 14.6;
  if (!p) { el.className = "banner info t-body"; el.textContent = rp ? "Size unknown from the name. Use 4-bit if it is 7B or larger." : ""; return; }
  const gb = (p * 1e9 * BPP[cfg.quant]) / GIB + 0.8;
  const head = `Estimated ${gb.toFixed(1)} GiB of ${tot.toFixed(1)} GiB`;
  if (gb > tot * 0.97) { el.className = "banner error t-body"; el.textContent = `${head}. This will not fit. Use 4-bit or a smaller model.`; }
  else if (gb > tot * 0.8) { el.className = "banner warn t-body"; el.textContent = `${head}. Tight: long chats may run out of memory.`; }
  else { el.className = "banner info t-body"; el.textContent = `${head}. Fits, with room for context.`; }
}

/* ---------------------------------------------------------------- chat */
const msgsEl = $("#msgs"), col = $("#col");
function scrollChat(force) { if (force || msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 160) msgsEl.scrollTop = msgsEl.scrollHeight; }
function msgHtml(m, i) {
  const last = i === chat.length - 1;
  if (m.role === "user") return `<div class="msg user" data-i="${i}"><div class="bubble">${esc(m.content)}</div></div>`;
  const live = busy && last;
  const stats = m.stats ? `<span class="mono t-small">${m.stats.tokens} tokens · ${m.stats.tps.toFixed(1)} tok/s${m.stopped ? " · stopped" : ""}</span>` : "";
  const acts = live ? "" : `${stats}<button class="iconbtn" data-copy="${i}" title="Copy" aria-label="Copy">${IC.copy}</button>` +
    (last ? `<button class="iconbtn" data-redo title="Regenerate" aria-label="Regenerate">${IC.redo}</button>` : "");
  return `<div class="msg assistant" data-i="${i}"><div class="bubble">${md(m.content) || ""}${live ? '<span class="cursor"></span>' : ""}</div>` +
    (m.error ? `<div class="banner error t-body">${esc(m.error)}</div>` : "") + `<div class="meta">${acts}</div></div>`;
}
function renderChat() {
  if (!chat.length) {
    const ready = ST.status === "ready", loading = ST.status === "loading";
    col.innerHTML = `<div class="welcome">${IC.chat}<h2>${ready ? "How can I help?" : loading ? "Loading model…" : "No model loaded"}</h2>` +
      `<p class="t-body">${ready ? "Your model is ready. Type a message below." : loading ? "This can take a few minutes the first time while weights download." : "Open Settings, pick a model and press Load model."}</p>` +
      (ready || loading ? "" : `<button class="btn tonal" id="openSettings" type="button">${IC.tune}Open settings</button>`) + `</div>`;
    const b = $("#openSettings"); if (b) b.onclick = () => setOpen(true);
  } else col.innerHTML = chat.map(msgHtml).join("");
  scrollChat(true);
}
function renderLast() {
  const i = chat.length - 1, el = $(`.msg[data-i="${i}"]`);
  if (!el) return renderChat();
  el.outerHTML = msgHtml(chat[i], i); scrollChat(false);
}
col.addEventListener("click", (e) => {
  const c = e.target.closest("[data-copy]"), r = e.target.closest("[data-redo]");
  if (c) navigator.clipboard?.writeText(chat[+c.dataset.copy].content).then(() => toast("Copied"), () => toast("Copy failed"));
  if (r && !busy) { chat.pop(); send(null); }
});
$("#btnClear").onclick = () => { if (busy) return; chat = []; saveChat(); renderChat(); };
$("#btnExport").onclick = () => {
  if (!chat.length) return toast("Nothing to export yet");
  const txt = chat.map((m) => `**${m.role === "user" ? "You" : "Assistant"}:**\n\n${m.content}`).join("\n\n---\n\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/markdown" })); a.download = "chat.md"; a.click();
};

async function send(text) {
  if (busy || ST.status !== "ready") return;
  if (text) chat.push({ role: "user", content: text });
  if (!chat.length || chat[chat.length - 1].role !== "user") return;
  const a = { role: "assistant", content: "" };
  chat.push(a); busy = true; renderChat(); updateUI();
  const msgs = [];
  if (cfg.system.trim()) msgs.push({ role: "system", content: cfg.system.trim() });
  chat.slice(0, -1).forEach((m) => msgs.push({ role: m.role, content: m.content }));
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: msgs, params: { max_new_tokens: cfg.max, temperature: cfg.temp, top_p: cfg.top_p, repetition_penalty: cfg.rep } }) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, k); buf = buf.slice(k + 1); if (!line) continue;
        const j = JSON.parse(line);
        if (j.t) { a.content += j.t; renderLast(); }
        if (j.error) a.error = j.error;
        if (j.done) { a.stats = j.stats; a.stopped = j.stopped; }
      }
    }
  } catch (e) { a.error = e.message || String(e); }
  busy = false; saveChat(); renderChat(); updateUI(); poll();
}
$("#sendBtn").onclick = () => {
  if (busy) return api("/api/stop", {}).catch(() => {});
  const t = $("#input").value.trim(); if (!t) return;
  $("#input").value = ""; autosize(); send(t);
};
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) $("#sendBtn").click(); } });
const autosize = () => { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; };
$("#input").addEventListener("input", () => { autosize(); updateUI(); });

/* ---------------------------------------------------------------- load / unload */
$$("[data-act]").forEach((b) => b.onclick = async () => {
  try {
    if (b.dataset.act === "load") {
      const m = modelId(); if (cfg.custom.trim() && !parseRepo(cfg.custom)) return toast("That link is not a valid Hugging Face model link");
      await api("/api/load", { model: m, quant: cfg.quant, token: $("#token").value });
      setOpen(false);
    } else await api("/api/unload", {});
    poll();
  } catch (e) { toast(e.message, 6000); }
});

/* ---------------------------------------------------------------- UI from state */
const CHIP = { idle: ["", "Idle"], loading: ["busy", "Loading"], ready: ["ok", "Ready"], generating: ["train", "Generating"], error: ["bad", "Error"] };
function updateUI() {
  const s = ST.status, gpu = ST.gpu, tot = gpu.total || 0, used = gpu.used || 0;
  const [cls, label] = CHIP[s] || CHIP.idle;
  $("#statusChip").className = "status " + cls; $("#statusChip").textContent = busy && s === "ready" ? "Generating" : label;
  $("#phaseText").textContent = s === "loading" ? `${ST.phase} · ${fmtT(ST.load_secs)}` : (s === "ready" || s === "generating") ? `${ST.model} (${ST.quant})` : "";
  $("#vramText").textContent = tot ? `${used.toFixed(1)}/${tot.toFixed(0)} GiB` : "";
  $("#loadbar").classList.toggle("on", s === "loading");
  $("#runError").textContent = s === "error" ? ST.error : "";
  const idleish = s === "idle" || s === "ready" || s === "error";
  $$('[data-act="load"]').forEach((b) => { b.disabled = !idleish || busy; b.innerHTML = `${IC.play}${s === "ready" ? "Load another" : s === "loading" ? "Loading…" : "Load model"}`; });
  $$('[data-act="unload"]').forEach((b) => { b.disabled = !(s === "ready" || s === "error") || busy; b.innerHTML = `${IC.eject}Unload`; });
  const inp = $("#input"), sb = $("#sendBtn");
  inp.disabled = s !== "ready" || busy;
  inp.placeholder = s === "ready" ? "Message the model…" : s === "loading" ? "Model is loading…" : "Load a model to start chatting";
  sb.className = "sendbtn" + (busy ? " stop" : ""); sb.innerHTML = busy ? IC.stop : IC.send;
  sb.setAttribute("aria-label", busy ? "Stop" : "Send");
  sb.disabled = busy ? false : !(s === "ready" && inp.value.trim());
}

/* ---------------------------------------------------------------- log */
async function pollLog() {
  try {
    const j = await api("/api/log?since=" + logSeq); logSeq = j.seq;
    if (!j.lines.length) return;
    const box = $("#logbox"), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    j.lines.forEach((l) => {
      const html = `<div class="ln ${l.l}" data-k="${l.k}"><span class="ts">${l.t}</span><span class="tx">${esc(l.m)}</span></div>`;
      const old = box.querySelector(`[data-k="${l.k}"]`);          // progress bars redraw the same line
      if (old) old.outerHTML = html; else box.insertAdjacentHTML("beforeend", html);
    });
    while (box.children.length > 1500) box.firstElementChild.remove();
    if (stick) box.scrollTop = box.scrollHeight;
  } catch (e) { /* handled by state poll */ }
}
$("#logClear").onclick = () => { $("#logbox").innerHTML = ""; };

/* ---------------------------------------------------------------- polling + connection dialog */
let prevStatus = "", firstPoll = true;
async function poll() {
  try {
    ST = await api("/api/state"); fails = 0; $("#connScrim").classList.remove("show");
    if (ST.status !== prevStatus) { prevStatus = ST.status; fit(); if (!busy) renderChat(); }
    if (firstPoll) { firstPoll = false; if (ST.status === "idle" || ST.status === "error") setOpen(true); }
    updateUI(); pollLog();
  } catch (e) {
    if (++fails >= 3) $("#connScrim").classList.add("show");
  }
}
$("#connRetry").onclick = poll;
(function loop() { poll().finally(() => setTimeout(loop, ST.status === "loading" || ST.status === "generating" ? 600 : 1500)); })();

fit(); renderChat(); updateUI();
</script>
</body>
</html>
